# Tells the website repo to rebuild when a release is published, so
# sharpemu.app/downloads lists the new build within a minute.
# Needs the SITE_DISPATCH_TOKEN repository secret in this repo.
name: Notify website

on:
  release:
    types: [published, released, edited, deleted]
  workflow_dispatch:

# The job authenticates with its own secret and never touches this repository.
permissions: {}

jobs:
  dispatch:
    # Runs in sharpemu/sharpemu (Windows and Linux builds) and in
    # sharpemu/sharpemu-mac (macOS builds): sharpemu.app/downloads lists both.
    # Other forks have nothing to tell the website, so they skip.
    if: github.repository == 'sharpemu/sharpemu' || github.repository == 'sharpemu/sharpemu-mac'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Trigger sharpemu-site rebuild
        env:
          TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "SITE_DISPATCH_TOKEN is not set — skipping website rebuild."
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/sharpemu/sharpemu-site/dispatches \
            -d '{"event_type":"release-published"}'
          echo "Website rebuild requested."
