name: Build and Release

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a PR or a feature branch supersedes the older run. Tag runs
# publish releases and main runs are the per-commit record, so neither is ever
# cancelled; manual runs are not either.
concurrency:
  group: build-release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch' && github.ref != 'refs/heads/main') }}

jobs:
  init:
    name: Init
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      code-changed: ${{ steps.changes.outputs.code-changed }}
      release-name: ${{ steps.vars.outputs.release-name }}
      release-tag: ${{ steps.vars.outputs.release-tag }}
      safe-ref: ${{ steps.vars.outputs.safe-ref }}
      short-sha: ${{ steps.vars.outputs.short-sha }}
      version: ${{ steps.vars.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Two commits are enough for the change filter below: on pull
          # requests HEAD is the merge commit and HEAD^1 is the base.
          fetch-depth: 2

      # Replaces the old workflow-level paths-ignore. That filter skipped the
      # whole workflow for docs-only changes, so REUSE lint never ran on them
      # and required checks never reported. Now every run reports; only the
      # macOS build is skipped when nothing but docs and images changed. Any
      # doubt (tag, manual run, new branch, force push, git error) builds.
      - name: Detect code changes
        id: changes
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          code_changed=true
          base=""

          if [ "${EVENT_NAME}" = "pull_request" ]; then
            base="HEAD^1"
          elif [ "${EVENT_NAME}" = "push" ] && [ "${GITHUB_REF_TYPE}" = "branch" ] \
              && [ -n "${BEFORE//0/}" ]; then
            if git fetch --no-tags --depth=1 origin "${BEFORE}"; then
              base="${BEFORE}"
            fi
          fi

          if [ -n "${base}" ] && files="$(git diff --name-only "${base}" HEAD)" && [ -n "${files}" ]; then
            echo "Changed files:"
            echo "${files}"
            if ! grep -qEv '\.(md|png|jpe?g)$' <<< "${files}"; then
              code_changed=false
            fi
          fi

          echo "code-changed=${code_changed}" >> "$GITHUB_OUTPUT"
          echo "code-changed=${code_changed}"

      - name: Compute workflow variables
        id: vars
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::7}"
          safe_ref="$(echo "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | sed 's#[^a-z0-9._-]#-#g')"
          version="$(python3 -c 'import sys, xml.etree.ElementTree as ET; version = ET.parse("Directory.Build.props").getroot().findtext(".//SharpEmuVersion"); sys.exit("Directory.Build.props is missing SharpEmuVersion") if not version or not version.strip() else print(version.strip())')"
          release_tag="v${version}"
          release_name="SharpEmu v${version}"

          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "${release_tag}" ]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match project version ${release_tag}." >&2
            exit 1
          fi

          {
            echo "short-sha=${short_sha}"
            echo "safe-ref=${safe_ref}"
            echo "release-tag=${release_tag}"
            echo "release-name=${release_name}"
            echo "version=${version}"
          } >> "$GITHUB_OUTPUT"

  reuse:
    name: REUSE Compliance
    needs: init
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run REUSE lint
        uses: fsfe/reuse-action@v6

  # This fork ships macOS only; the win-x64 and linux-x64 jobs run upstream.
  build-posix:
    # Static on purpose: when the job is skipped for a docs-only change, GitHub
    # reports a skipped matrix job under its unexpanded name, which would not
    # satisfy a required check called "Build osx-x64". Keep this in step with
    # the single matrix entry below.
    name: Build osx-x64
    needs:
      - init
      - reuse
    if: needs.init.outputs.code-changed == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            rid: osx-x64
    env:
      DOTNET_NOLOGO: true
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
      PUBLISH_DIR: ${{ github.workspace }}/artifacts/publish/${{ matrix.rid }}
      TEST_RESULTS_DIR: ${{ github.workspace }}/artifacts/test-results
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.103
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            Directory.Build.props

      - name: Restore solution
        run: dotnet restore SharpEmu.slnx

      - name: Test macOS build scripts and native guest mapping
        run: python3 -m unittest discover -s tests/scripts -v

      # The hyphenated file names are not importable, so unittest discovery
      # cannot find them; each file runs itself.
      - name: Test macOS harness scripts
        shell: bash
        run: |
          failed=0
          for test_file in scripts/macos/test-*.py; do
            echo "::group::${test_file}"
            python3 "${test_file}" -v || failed=1
            echo "::endgroup::"
          done
          exit "${failed}"

      - name: Build solution
        run: dotnet build SharpEmu.slnx -c Release --no-restore

      # The aerolib.bin MSBuild task does platform-sensitive path handling, so a
      # generation regression on macOS surfaces here.
      - name: Run tests
        timeout-minutes: 25
        run: >
          dotnet test SharpEmu.slnx -c Release --no-build --verbosity normal
          --logger "trx;LogFilePrefix=test-results"
          --results-directory "$TEST_RESULTS_DIR"

      # Both steps run after a failed test step too, so a red build says which
      # tests failed without opening the raw log.
      - name: Summarize test results
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/trx-summary.py "$TEST_RESULTS_DIR" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.rid }}-${{ needs.init.outputs.short-sha }}
          path: ${{ env.TEST_RESULTS_DIR }}
          retention-days: 14
          if-no-files-found: ignore

      - name: Publish ${{ matrix.rid }} CLI
        run: dotnet publish src/SharpEmu.CLI/SharpEmu.CLI.csproj -c Release -r ${{ matrix.rid }} --self-contained true --no-restore -p:PublishDir="$PUBLISH_DIR"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: sharpemu-${{ matrix.rid }}-${{ needs.init.outputs.short-sha }}
          path: ${{ env.PUBLISH_DIR }}
          if-no-files-found: error
          include-hidden-files: true

      # The .app bundle is the macOS distribution format; the flat directory
      # above stays as the comparison/legacy profile. build-app.sh runs its own
      # osx-x64 publish because the bundle needs a non-single-file layout, then
      # ad-hoc signs with the hardened runtime and verifies the result. No
      # signing identity and no notarization credentials are used here, so a
      # fork or a PR build produces the same artifact as a maintainer does.
      - name: Build macOS app bundle
        if: matrix.rid == 'osx-x64'
        run: scripts/macos/build-app.sh

      # Only the zip is uploaded, not the assembled bundle: a .app uploaded as
      # a raw directory loses the symlinks and extended attributes its
      # signature seals, so it would arrive broken. The ditto archive keeps
      # them, and the artifact name carries the RID so PR Build Links finds it.
      - name: Upload macOS app bundle artifact
        if: matrix.rid == 'osx-x64'
        uses: actions/upload-artifact@v7
        with:
          name: sharpemu-osx-x64-app-${{ needs.init.outputs.short-sha }}
          path: artifacts/macos/sharpemu-*-osx-x64-app.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs:
      - init
      - build-posix
    # Versioned releases are immutable and tag-driven. Branch and manual runs
    # still produce Actions artifacts without modifying a published release.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release

      - name: Package release assets
        shell: bash
        env:
          SHORT_SHA: ${{ needs.init.outputs.short-sha }}
          VERSION: ${{ needs.init.outputs.version }}
        run: |
          set -euo pipefail

          macos_dir="release/sharpemu-osx-x64-${SHORT_SHA}"
          macos_app_dir="release/sharpemu-osx-x64-app-${SHORT_SHA}"
          for package_dir in "${macos_dir}" "${macos_app_dir}"; do
            test -d "${package_dir}"
          done

          mkdir -p release-assets
          chmod +x "${macos_dir}/SharpEmu"
          tar -czf "release-assets/sharpemu-${VERSION}-osx-x64.tar.gz" -C "${macos_dir}" .

          # Copied, never repacked: the zip was produced by ditto so that the
          # signed bundle's symlinks and extended attributes survive, and
          # unpacking and re-zipping it here would undo that.
          cp "${macos_app_dir}/sharpemu-${VERSION}-osx-x64-app.zip" release-assets/

      - name: Build release notes
        shell: bash
        env:
          MAX_COMMITS: 200
          RELEASE_TAG: ${{ needs.init.outputs.release-tag }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          SHORT_SHA: ${{ needs.init.outputs.short-sha }}
          VERSION: ${{ needs.init.outputs.version }}
        run: |
          set -euo pipefail

          previous_tag="$(git describe --tags --abbrev=0 --match 'v*' "${RELEASE_TAG}^" 2>/dev/null || true)"

          if [ -n "${previous_tag}" ]; then
            range="${previous_tag}..${RELEASE_TAG}"
          else
            range="${RELEASE_TAG}"
          fi

          git log --no-merges --reverse --pretty=tformat:"%H%x1f%h%x1f%s" "${range}" > commits.txt
          total="$(wc -l < commits.txt)"

          {
            # shellcheck disable=SC2016 # literal Markdown backticks
            printf 'Automated SharpEmu v%s build for commit [`%s`](%s/commit/%s).\n\n' \
              "${VERSION}" "${SHORT_SHA}" "${REPO_URL}" "${GITHUB_SHA}"

            if [ -n "${previous_tag}" ]; then
              printf '## Changes since %s\n\n' "${previous_tag}"
            else
              printf '## Changes\n\n'
            fi

            if [ "${total}" -eq 0 ]; then
              printf '_No commits since %s._\n' "${previous_tag}"
            else
              head -n "${MAX_COMMITS}" commits.txt | while IFS=$'\x1f' read -r sha short subject; do
                # shellcheck disable=SC2016 # literal Markdown backticks
                printf -- '- %s ([`%s`](%s/commit/%s))\n' "${subject}" "${short}" "${REPO_URL}" "${sha}"
              done

              if [ "${total}" -gt "${MAX_COMMITS}" ]; then
                printf '\n_…and %s more commits._\n' "$((total - MAX_COMMITS))"
              fi
            fi

            printf '\n'

            if [ -n "${previous_tag}" ]; then
              printf '**Full changelog**: %s/compare/%s...%s\n' "${REPO_URL}" "${previous_tag}" "${RELEASE_TAG}"
            else
              printf '**Full changelog**: %s/commits/%s\n' "${REPO_URL}" "${RELEASE_TAG}"
            fi
          } > release-notes.md

          cat release-notes.md

      - name: Create release
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NAME: ${{ needs.init.outputs.release-name }}
          RELEASE_TAG: ${{ needs.init.outputs.release-tag }}
        run: |
          mapfile -t assets < <(find release-assets -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.gz' \) | sort)
          # osx-x64 tar.gz, osx-x64 .app zip.
          if [ "${#assets[@]}" -ne 2 ]; then
            echo "Expected 2 release assets, found ${#assets[@]}." >&2
            exit 1
          fi

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists and will not be modified." >&2
            exit 1
          fi

          gh release create "${RELEASE_TAG}" "${assets[@]}" \
            --verify-tag \
            --title "${RELEASE_NAME}" \
            --notes-file release-notes.md
