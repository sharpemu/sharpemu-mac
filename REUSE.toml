version = 1

[[annotations]]
path = [
    "REUSE.toml",
    "nuget.config",
    "global.json",
    "**/packages.lock.json",
    "scripts/ps5_names.txt",
    "src/SharpEmu.GUI/Languages/**",
    "src/SharpEmu.ShaderCompiler.Metal/Templates/**",
    "tests/SharpEmu.ShaderCompiler.Metal.Tests/Goldens/**",
    "_logs/**",
    ".github/images/**",
    ".github/pull_request_template.md",
    "assets/images/**"
]
precedence = "aggregate"
SPDX-FileCopyrightText = "SharpEmu Emulator Project"
SPDX-License-Identifier = "GPL-2.0-or-later"

[[annotations]]
path = "src/SharpEmu.GUI/Assets/Fonts/MaterialSymbolsRounded-*.ttf"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Google LLC"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "src/SharpEmu.LibAtrac9/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2018 Alex Barney"
SPDX-License-Identifier = "MIT"

# macOS fork: documentation, localisation data, test fixtures and analysis
# tooling. Formats here either cannot carry a header (binary, CSV, JSON) or
# are generated/captured data, so they are annotated in one place.
[[annotations]]
path = [
    "docs/**",
    "src/SharpEmu.Application/Languages/**",
    "tests/SharpEmu.ShaderCompiler.Metal.Tests/Conformance/**",
    "tests/Fixtures/**",
    "tools/re/**"
]
precedence = "aggregate"
SPDX-FileCopyrightText = "SharpEmu Emulator Project"
SPDX-License-Identifier = "GPL-2.0-or-later"

# AMD's MIT licence text retained next to the AddrLib-derived fixtures.
[[annotations]]
path = "tests/Fixtures/**/AMD-MIT-LICENSE.txt"
precedence = "override"
SPDX-FileCopyrightText = "2007-2025 Advanced Micro Devices, Inc."
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "src/SharpEmu.Libs/VideoOut/Overlay/Fonts/Inter-*.ttf"
precedence = "aggregate"
SPDX-FileCopyrightText = "2016 The Inter Project Authors (https://github.com/rsms/inter)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "src/SharpEmu.Libs/VideoOut/Overlay/Fonts/JetBrainsMono-*.ttf"
precedence = "aggregate"
SPDX-FileCopyrightText = "2020 The JetBrains Mono Project Authors (https://github.com/JetBrains/JetBrainsMono)"
SPDX-License-Identifier = "OFL-1.1"
